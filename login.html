<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>REGISTRO</title>
</head>
<body>
    <form class="formulario">
        <h1>Registro de usuario</h1>
        <div class="contenedor">
            <div class="input-contenedor">
                <img class="icon" src="icon/mail.jpg">
                <input type="text" placeholder="Correo Electrónico">
            </div>
            <div class="input-contenedor">
                <img class="icon" src="icon/password.jpg">
                <input type="password" placeholder="Contraseña">
            </div>
            <input type="submit" value="Registro" class="button">
            <p>Al registrarse, acepta nuestras condiciones de uso y política de privacidad.</p>
            <p>¿No tiene una cuenta? <a href="index.html" class="link">Regístrese</a></p>
        </div>
    </form>
</body>
</html>
